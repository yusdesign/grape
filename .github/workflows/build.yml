name: Build & Release APK

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  NODE_VERSION: 22
  JAVA_VERSION: 21

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    outputs:
      release_ready: ${{ steps.get_version.outputs.release_ready }}
      version: ${{ steps.get_version.outputs.version }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Get version
        id: get_version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "release_ready=true" >> $GITHUB_OUTPUT
          else
            echo "version=dev" >> $GITHUB_OUTPUT
            echo "release_ready=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Fix and install dependencies
        run: |
          # Remove broken lock file
          rm -f package-lock.json
          
          # Generate new lock file
          npm install --package-lock-only
          
          # Install dependencies (with fallback to install if ci fails)
          if ! npm ci --no-audit --no-fund; then
            echo "⚠️ npm ci failed, using npm install..."
            npm install --no-audit --no-fund
          fi
          
          # Install Capacitor CLI globally
          npm install -g @capacitor/cli
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 cmdline-tools;latest'
      
      - name: Build web assets
        run: |
          mkdir -p www
          npm run build
          ls -la www/
          if [ -f "public/sample.json" ]; then
            cp public/sample.json www/
            echo "✅ sample.json copied to www/"
          fi
      
      - name: Add Android platform and sync
        run: |
          rm -rf android/
          npx cap add android
          npx cap sync android
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
      
      - name: Create Android file_paths.xml
        run: |
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/file_paths.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <files-path name="files" path="." />
              <cache-path name="cache" path="." />
              <external-files-path name="external-files" path="." />
              <external-cache-path name="external-cache" path="." />
              <external-path name="external" path="." />
          </paths>
          EOF
          echo "✅ file_paths.xml created"
      
      - name: Update MainActivity with permissions
        run: |
          cat > android/app/src/main/java/com/yusdesign/grape/MainActivity.java << 'EOF'
          package com.yusdesign.grape;

          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.webkit.WebView;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              private static final int PERMISSION_REQUEST_CODE = 100;
              private static final String[] REQUIRED_PERMISSIONS = {
                  Manifest.permission.READ_EXTERNAL_STORAGE,
                  Manifest.permission.WRITE_EXTERNAL_STORAGE,
                  Manifest.permission.ACCESS_MEDIA_LOCATION
              };

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.KITKAT) {
                      WebView.setWebContentsDebuggingEnabled(true);
                  }
                  
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      requestStoragePermissions();
                  }
              }

              private void requestStoragePermissions() {
                  boolean allGranted = true;
                  for (String permission : REQUIRED_PERMISSIONS) {
                      if (ContextCompat.checkSelfPermission(this, permission) 
                          != PackageManager.PERMISSION_GRANTED) {
                          allGranted = false;
                          break;
                      }
                  }
                  
                  if (!allGranted) {
                      ActivityCompat.requestPermissions(
                          this, 
                          REQUIRED_PERMISSIONS, 
                          PERMISSION_REQUEST_CODE
                      );
                  }
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
              }
          }
          EOF
          echo "✅ MainActivity.java updated"
      
      - name: Verify Android files
        run: |
          echo "Checking file_paths.xml:"
          ls -la android/app/src/main/res/xml/file_paths.xml || echo "❌ Missing!"
          echo "Checking MainActivity.java:"
          ls -la android/app/src/main/java/com/yusdesign/grape/MainActivity.java || echo "❌ Missing!"
      
      - name: Create keystore
        if: steps.get_version.outputs.release_ready == 'true'
        run: |
          keytool -genkey -v -keystore release.keystore \
            -alias key0 -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass ${{ secrets.KEYSTORE_PASSWORD }} \
            -keypass ${{ secrets.KEY_PASSWORD }} \
            -dname "CN=Graph Viewer, OU=Dev, O=Company, L=City, S=State, C=US"
      
      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      
      - name: Build Release APK
        if: steps.get_version.outputs.release_ready == 'true'
        run: |
          cd android
          ./gradlew assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: grape-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
      
      - name: Upload Release APK
        if: steps.get_version.outputs.release_ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: grape-release-${{ steps.get_version.outputs.version }}
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 90
      
      - name: Create Release
        if: steps.get_version.outputs.release_ready == 'true' && success()
        uses: softprops/action-gh-release@v1
        with:
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
          name: Release ${{ steps.get_version.outputs.version }}
          tag_name: ${{ steps.get_version.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Build failed for commit ${GITHUB_SHA::7}"
          echo "Check logs at: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
