name: Build Grape Capacitor

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 cmdline-tools;latest'

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund --legacy-peer-deps
          npm install -D @capacitor/cli
          npm install @capacitor/android @capacitor/core @capacitor/filesystem @capawesome/capacitor-file-picker @capawesome/capacitor-asset-manager vis-network html2canvas

      - name: Build Android APK
        run: |
          # Clean and rebuild Android platform
          rm -rf android
          npx cap add android
          npx cap sync
          
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: grape-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
