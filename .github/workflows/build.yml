name: Build & Release APK

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  NODE_VERSION: 22
  JAVA_VERSION: 21  # ⭐ Updated to 21

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    outputs:
      release_ready: ${{ steps.check_tag.outputs.release_ready }}
      version: ${{ steps.get_version.outputs.version }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Get version
        id: get_version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "release_ready=true" >> $GITHUB_OUTPUT
          else
            echo "version=dev" >> $GITHUB_OUTPUT
            echo "release_ready=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          npm install -g @capacitor/cli
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 cmdline-tools;latest'
      
      - name: Build web assets
        run: |
          mkdir -p www
          npm run build
      
      - name: Add Android platform and sync
        run: |
          rm -rf android/
          npx cap add android
          npx cap sync android
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
      
      - name: Verify Gradle wrapper exists
        run: |
          if [ -f "android/gradlew" ]; then
            echo "✅ gradlew found"
          else
            echo "❌ gradlew not found!"
            ls -la android/
            exit 1
          fi
      
      - name: Create keystore
        if: steps.get_version.outputs.release_ready == 'true'
        run: |
          keytool -genkey -v -keystore release.keystore \
            -alias key0 -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass ${{ secrets.KEYSTORE_PASSWORD }} \
            -keypass ${{ secrets.KEY_PASSWORD }} \
            -dname "CN=Graph Viewer, OU=Dev, O=Company, L=City, S=State, C=US"
      
      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      
      - name: Build Release APK
        if: steps.get_version.outputs.release_ready == 'true'
        run: |
          cd android
          ./gradlew assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: grape-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
      
      - name: Upload Release APK
        if: steps.get_version.outputs.release_ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: grape-release-${{ steps.get_version.outputs.version }}
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 90
      
      - name: Create Release
        if: steps.get_version.outputs.release_ready == 'true' && success()
        uses: softprops/action-gh-release@v1
        with:
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
          name: Release ${{ steps.get_version.outputs.version }}
          tag_name: ${{ steps.get_version.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Build failed for commit ${GITHUB_SHA::7}"
          echo "Check logs at: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
