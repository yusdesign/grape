<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>grape</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- ⭐ Startup indicator -->
    <div id="startupCheck" style="position:fixed;top:0;left:0;right:0;background:red;color:white;padding:4px;text-align:center;z-index:99999;display:none;">
        ⚠️ JavaScript NOT LOADED - Check console
    </div>
    <div id="toolbar">
        <button id="openFileBtn">📂 Open File</button>
        <button id="sampleFileBtn">📄 Load Sample</button>
        <button id="exportBtn">💾 Export Graph</button>
        <button id="resetViewBtn">🔄 Reset View</button>
        <button id="shareBtn">📤 Share</button>
        <span id="status">Ready</span>
        <span id="nodeCount"></span>
    </div>
    
    <!-- Hidden file input -->
    <input type="file" id="fileInput" accept=".json,.xml,.html,.svg,.txt" style="display:none">
    
    <div id="graphContainer"></div>
    
    <div id="contextMenu" style="display:none; position:fixed; min-width:150px; z-index:1000;">
        <div id="contextMenuContent"></div>
    </div>
    
    <!-- Debug Console -->
    <div id="debugConsole"></div>
    
    <script type="module" src="index.js"></script>
    <!-- In index.html, right after the module script -->
    <script>
        console.log('📜 Inline script running');
        document.getElementById('startupCheck').style.display = 'none';
        document.getElementById('startupCheck').textContent = '✅ JavaScript loaded!';
        document.getElementById('startupCheck').style.background = 'green';
        document.getElementById('startupCheck').style.display = 'block';
        
        // Auto-hide after 3 seconds
        setTimeout(() => {
            document.getElementById('startupCheck').style.display = 'none';
        }, 3000);
    </script>
</body>
</html>
