<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>grape 🍇</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🍇%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="js/lib/vis-network.min.css">
    <!-- Detect GitHub Pages environment -->
    <script>
        window.IS_GITHUB_PAGES = window.location.hostname.includes('github.io');
        console.log('🌐 Environment:', window.IS_GITHUB_PAGES ? 'GitHub Pages' : 'Local/Capacitor');
    </script>
</head>
<body>
    <!-- ===== TOOLBAR ===== -->
    <div id="toolbar">
        <span id="brand">🍇 grape</span>
        <button id="sampleBtn">📄 Sample</button>
        <button id="menuBtn">☰</button>
        <span id="status">Ready</span>
        <span id="nodeCount">0 nodes</span>
    </div>

    <!-- ===== DROPDOWN MENU ===== -->
    <div id="menuDropdown" style="display:none;">
        <div id="menuPickFile">📂 Open File</div>
        <div id="menuExport">💾 Export</div>
        <div id="menuReset">🔄 Reset View</div>
        <div id="menuShare">📤 Share</div>
    </div>

    <!-- ===== GRAPH CONTAINER ===== -->
    <div id="graphContainer"></div>

    <!-- ===== DEBUG CONSOLE ===== -->
    <div id="debugConsole">
        <div style="color:#44ff88;">🐛 Debug console active</div>
    </div>

    <!-- Hidden file input -->
    <input type="file" id="fileInput" accept=".json,.xml,.html,.svg,.txt" style="display:none">

    <!-- Context Menu -->
    <div id="contextMenu" style="display:none; position:fixed; min-width:150px; z-index:1000;">
        <div id="contextMenuContent"></div>
    </div>

    <!-- Capacitor bridge (auto-generated by npx cap sync) -->
    <script src="capacitor.js"></script>

    <!-- Vendor libraries -->
    <script src="js/lib/vis-network.min.js"></script>
    <script src="js/lib/html2canvas.min.js"></script>

    <!-- App scripts -->
    <script src="js/CheckSystem.js"></script>
    <script src="js/GraphParser.js"></script>
    <script src="js/GraphRenderer.js"></script>
    <script src="js/FilePicker.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
